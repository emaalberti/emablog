<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      color: #0a1f44;
      background: #f0ede6;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 80px 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 48px;
      color: #f0ede6;
      text-decoration: none;
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .2s;
    }

    .back:hover { opacity: 1; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .date {
      font-size: .8rem;
      opacity: .5;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 24px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="container">

    <a class="back" href="../index.html">← Back</a>

    <h1>Il mio diritto alla leggerezza</h1>
    <div class="date">December 2025 - Emanuele</div>
    <p>paragraph </p>
  </div>
</body>
</html>
