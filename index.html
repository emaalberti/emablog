<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background : #ffffff;
      color: #0a1f44;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 60px 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: .02em;
    }

    .pdf-list {
      list-style: none;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pdf-list li a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border: 1.5px solid #0a1f44;
      border-radius: 4px;
      text-decoration: none;
      color: #0a1f44;
      font-size: .95rem;
      transition: background .2s, color .2s;
    }

    .pdf-list li a:hover {
      color: #ffffff;
      background: #0a1f44;
    }

    .pdf-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <h1>Raccolta</h1>

  <ul class="pdf-list">
    <li>
      <a href="articles/article1.html" target="_blank">
        <span class="pdf-icon">📄</span>
        Il mio diritto alla leggerezza
      </a>
    </li>
    <li>
      <a href="articles/article2.html" target="_blank">
        <span class="pdf-icon">📄</span>
        Volersi bene è sufficiente
      </a>
    </li>
    <li>
      <a href="articles/article3.html" target="_blank">
        <span class="pdf-icon">📄</span>
        L'importanza dei modelli mentali
      </a>
  </ul>

  <div id="feedback-container" style="position: fixed; bottom: 20px; right: 20px; background: white; border: 1px solid #ccc; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000;">
    <h4 style="margin: 0; font-family: sans-serif;">Send Feedback</h4>
    <input type="text" id="user-name-input" placeholder="Your name (Optional)" style="padding: 5px;">
    <textarea id="feedback-input" placeholder="Enter feedback..." style="padding: 5px; min-height: 60px;"></textarea>
    <button onclick="submitFeedback()" style="background: #007bff; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">Send</button>
</div>
</body>
</html>

<script>
async function submitFeedback() {
    // 1. Grab data from the inputs
    const feedbackText = document.getElementById('feedback-input').value;
    const userName = document.getElementById('user-name-input').value || "Anonymous";

    // Validation: Don't send empty messages
    if (!feedbackText.trim()) {
        alert("Please enter some feedback first!");
        return;
    }

    try {
        // 2. Send the POST request to your FastAPI server
        const response = await fetch('http://127.0.0.1:8000/submit-feedback', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: feedbackText,
                user_name: userName
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Feedback sent successfully!");
            // Clear the input after success
            document.getElementById('feedback-input').value = "";
        } else {
            alert("Error: " + data.detail);
        }
    } catch (error) {
        console.error("Connection failed:", error);
        alert("Could not connect to the server. Is FastAPI running?");
    }
}
</script>
