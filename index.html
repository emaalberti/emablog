<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background : #ffffff;
      color: #0a1f44;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 60px 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: .02em;
    }

    .pdf-list {
      list-style: none;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pdf-list li a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border: 1.5px solid #0a1f44;
      border-radius: 4px;
      text-decoration: none;
      color: #0a1f44;
      font-size: .95rem;
      transition: background .2s, color .2s;
    }

    .pdf-list li a:hover {
      color: #ffffff;
      background: #0a1f44;
    }

    .pdf-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <h1>Raccolta</h1>

  <ul class="pdf-list">
    <li>
      <a href="articles/article1.html" target="_blank">
        <span class="pdf-icon">📄</span>
        Il mio diritto alla leggerezza
      </a>
    </li>
    <li>
      <a href="articles/article2.html" target="_blank">
        <span class="pdf-icon">📄</span>
        Volersi bene è sufficiente
      </a>
    </li>
    <li>
      <a href="articles/article3.html" target="_blank">
        <span class="pdf-icon">📄</span>
        L'importanza dei Modelli Mentali
      </a>
  </ul>
</body>
</html>
